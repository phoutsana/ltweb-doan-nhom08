<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liên hệ - Fashion Store</title>

    <meta name="description"
          content="Liên hệ với Fashion Store để gửi câu hỏi hoặc góp ý về sản phẩm.">
</head>

<body>

    <header>
        <h1>Liên hệ với Fashion Store</h1>
        <p>Gửi thông tin hoặc câu hỏi cho chúng tôi</p>
    </header>

    <nav aria-label="Điều hướng chính">
        <ul>
            <li>
                <a href="index.html">Trang chủ</a>
            </li>

            <li>
                <a href="danh-sach.html">Sản phẩm</a>
            </li>

            <li>
                <a href="chi-tiet.html">Chi tiết sản phẩm</a>
            </li>

            <li>
                <a href="gioi-thieu.html">Giới thiệu</a>
            </li>

            <li>
                <a href="lien-he.html">Liên hệ</a>
            </li>
        </ul>
    </nav>

    <main>

        <section>
            <h2>Form liên hệ</h2>

            <form action="#" method="post">

                <fieldset>

                    <legend>Thông tin người dùng</legend>

                    <p>
                        <label for="fullname">
                            Họ và tên:
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            minlength="2"
                            required>
                    </p>

                    <p>
                        <label for="email">
                            Email:
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required>
                    </p>

                    <p>
                        <label for="phone">
                            Số điện thoại:
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            pattern="[0-9]{10}"
                            placeholder="0123456789"
                            required>
                    </p>

                    <p>
                        <label for="age">
                            Tuổi:
                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            min="16"
                            max="100"
                            required>
                    </p>

                    <p>
                        <label for="date">
                            Ngày liên hệ:
                        </label>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            required>
                    </p>

                    <p>
                        <label for="topic">
                            Chủ đề:
                        </label>

                        <select
                            id="topic"
                            name="topic"
                            required>

                            <option value="">
                                -- Chọn chủ đề --
                            </option>

                            <option value="product">
                                Hỏi về sản phẩm
                            </option>

                            <option value="order">
                                Hỏi về đơn hàng
                            </option>

                            <option value="feedback">
                                Góp ý
                            </option>

                        </select>
                    </p>

                    <p>
                        <label for="message">
                            Nội dung:
                        </label>
                    </p>

                    <p>
                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            cols="50"
                            minlength="10"
                            required></textarea>
                    </p>

                    <p>
                        <button type="submit">
                            Gửi thông tin
                        </button>

                        <button type="reset">
                            Nhập lại
                        </button>
                    </p>

                </fieldset>

            </form>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Fashion Store. All rights reserved.
        </p>
    </footer>

</body>
</html>
